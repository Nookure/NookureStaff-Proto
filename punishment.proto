syntax = "proto3";
package com.nookure.staff.api.proto;

import "action.proto";

enum PunishmentType {
  PUNISHMENT_TYPE_UNKNOWN = 0;
  BAN = 1;
  TEMP_BAN = 2;
  MUTE = 3;
  TEMP_MUTE = 4;
  WARN = 5;
  KICK = 6;
  IP_BAN = 7;
  IP_MUTE = 8;
}

enum EvidenceType {
  EVIDENCE_TYPE_UNKNOWN = 0;
  IMAGE_URL = 1;
  S3_OBJECT = 2;
  ACTION_LOGS = 3;
  TEXT_NOTE = 4;
}

message PunishmentEvidenceEntry {
  int64 id = 1;
  EvidenceType type = 2;
  string evidence_url = 3;
  optional string s3_key = 4;
  repeated int64 attached_action_ids = 5;
  repeated ActionEntry attached_actions = 6;
  optional string note = 7;
  optional ActionPlayer created_by = 8;
  int64 created_at = 9;
}

message PunishmentEntry {
  int64 id = 1;
  PunishmentType type = 2;
  optional ActionPlayer target = 3;
  optional string target_ip = 4;
  optional ActionPlayer punisher = 5;
  string punisher_name = 6;
  string reason = 7;
  int64 created_at = 8;
  optional int64 expires_at = 9;
  bool active = 10;
  bool silent = 11;
  string server_name = 12;
  optional string pardon_reason = 13;
  optional ActionPlayer pardoned_by = 14;
  optional int64 pardoned_at = 15;
  bool requires_evidence = 16;
  optional int64 evidence_deadline = 17;
  optional int64 triggered_by_warn_id = 18;
  repeated PunishmentEvidenceEntry evidences = 19;
  optional string category = 20;
}

message PunishmentPagination {
  int32 page = 1;
  int32 page_size = 2;
  int32 total_pages = 3;
  int64 total_elements = 4;
  bool has_next = 5;
  bool has_previous = 6;
}

// 0x12 (Serverbound)
message PunishmentQueryRequest {
  optional string player_uuid = 1;
  optional string player_name = 2;
  optional string target_ip = 3;
  optional PunishmentType type = 4;
  optional bool active = 5;
  optional bool requires_evidence = 6;
  optional string punisher_name = 7;
  optional string server_name = 8;
  optional int64 from_timestamp = 9;
  optional int64 to_timestamp = 10;
  int32 page = 11;
  int32 page_size = 12;
}

// 0x12 (Clientbound)
message PunishmentQueryResponse {
  repeated PunishmentEntry punishments = 1;
  PunishmentPagination pagination = 2;
}

// 0x13 (Serverbound)
message CreatePunishmentRequest {
  string target = 1;
  PunishmentType type = 2;
  string reason = 3;
  optional int64 duration_seconds = 4;
  bool silent = 5;
  optional string server_name = 6;
  optional string category = 7;
  optional string initial_evidence_url = 8;
  optional string initial_evidence_note = 9;
  repeated int64 attached_action_ids = 10;
}

// 0x13 (Clientbound)
message CreatePunishmentResponse {
  bool success = 1;
  optional string error_message = 2;
  optional PunishmentEntry punishment = 3;
}

// 0x14 (Serverbound)
message PardonPunishmentRequest {
  int64 punishment_id = 1;
  optional string reason = 2;
  bool silent = 3;
}

// 0x14 (Clientbound)
message PardonPunishmentResponse {
  bool success = 1;
  optional string error_message = 2;
  optional PunishmentEntry punishment = 3;
}

// 0x15 (Serverbound)
message EvidencePresignedUploadRequest {
  int64 punishment_id = 1;
  string content_type = 2;
  int64 content_length = 3;
}

// 0x15 (Clientbound)
message EvidencePresignedUploadResponse {
  bool success = 1;
  optional string error_message = 2;
  optional string upload_url = 3;
  optional string object_key = 4;
  optional int64 expires_in_seconds = 5;
}

// 0x16 (Serverbound)
message EvidenceConfirmUploadRequest {
  int64 punishment_id = 1;
  string object_key = 2;
  EvidenceType type = 3;
  optional string note = 4;
  repeated int64 attached_action_ids = 5;
}

// 0x16 (Clientbound)
message EvidenceConfirmUploadResponse {
  bool success = 1;
  optional string error_message = 2;
  optional PunishmentEvidenceEntry evidence = 3;
}

// 0x17 (Serverbound)
message RemoveEvidenceRequest {
  int64 punishment_id = 1;
  int64 evidence_id = 2;
}

// 0x17 (Clientbound)
message RemoveEvidenceResponse {
  bool success = 1;
  optional string error_message = 2;
}

// 0x18 (Clientbound Broadcast)
enum PunishmentNotificationType {
  NOTIFICATION_UNKNOWN = 0;
  PUNISHMENT_CREATED = 1;
  PUNISHMENT_PARDONED = 2;
  EVIDENCE_ADDED = 3;
  EVIDENCE_REMOVED = 4;
  DEADLINE_EXPIRED = 5;
}

message PunishmentNotification {
  PunishmentNotificationType type = 1;
  PunishmentEntry punishment = 2;
}

message PunishmentTemplate {
  PunishmentType type = 1;
  string reason = 2;
  string duration = 3;
  string key = 4;
  string displayName = 5;
}

// 0x1E
message SyncPunishmentTemplates {
  repeated PunishmentTemplate templates = 1;
}