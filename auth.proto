syntax = "proto3";
package com.nookure.staff.api.proto;

// 0x02
message AuthKey {
    string key = 1;
}

// 0x03
message AuthComplete {
    string sender_username = 1;
    string sender_uuid = 2;
}

enum DisconnectReason {
    PLAYER_DISCONNECTED = 0;
    SERVER_SHUTDOWN = 1;
    AKKO_CLOSED = 2;
    UNKNOWN = 3;
    NO_PERMISSION = 4;
}

// 0x09
message Disconnect {
    DisconnectReason reason = 1;
}